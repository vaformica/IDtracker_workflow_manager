[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idtracker-workflow-manager"
version = "0.3.0"
description = "Auditable workflow management for beetle IDtracker data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
idtracker-firebird-backend = "idtracker_workflow_manager.remote_backend:main"
idtracker-video-intake = "idtracker_workflow_manager.video_intake:main"

[tool.setuptools.packages.find]
where = ["src"]
